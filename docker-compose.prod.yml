include:
  - docker-compose.yml

services:

  frontend:
    build:
      target: production
    container_name: transcendence-frontend
    volumes:
      - frontend_build:/usr/share/nginx/html

  # === Backend Microservices ===

  gateway:
    build:
      target: production
    container_name: transcendence-gateway
    expose:
      - "3002"

  core:
    build:
      target: production
    container_name: transcendence-core
    expose:
      - "3000"

  auth:
    build:
      target: production
    container_name: transcendence-auth
    expose:
      - "3001"

  game:
    build:
      target: production
    container_name: transcendence-game
    expose:
      - "3003"

  # === Infrastructure ===

  vault:
    container_name: transcendence-vault
    volumes:
      - ./vault:/vault
      - ./.env:/vault/seeds/.env:ro
      - vault_data:/vault/file
    ports:
      - "127.0.0.1:8200:8200"
    command: ["/bin/sh", "/vault/scripts/vault-prod-entrypoint.sh"]

  db:
    container_name: transcendence-db
    expose:
      - "5432"
    volumes:
      - db_data_prod:/var/lib/postgresql/data

  nginx:
    container_name: transcendence-nginx
    build:
      args:
        MODSEC: "true"
    depends_on:
      frontend:
        condition: service_completed_successfully
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
    networks:
      edge_transcendence:
        aliases: [transcendence-proxy]
      transcendence_net: {}

  migration:
    container_name: transcendence-migration

  healthchecker:
    container_name: transcendence-healthchecker

networks:
  edge_transcendence:
    external: true

volumes:
  db_data_prod:
  frontend_build:
  vault_data:
