load_module /etc/nginx/modules/ngx_http_modsecurity_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Serve frontend build
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ /\. {
            deny all;
            return 403;
        }

        location ~* \.(env|git|gitignore|htaccess|htpasswd|ssh|sql|bak|swp|old|tmp|log)$ {
            deny all;
            return 403;
        }

        location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh|bash)$ {
            return 404;
        }

        # React SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Api routes → gateway
        location /api/ {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
            set $gateway_upstream http://gateway:3002;
            proxy_pass $gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https; # public scheme is always https
            proxy_set_header X-Forwarded-Host $host;
        }

        # Realtime WebSockets → gateway
        location /rt/socket.io/ {
            set $gateway_ws_upstream http://gateway:3002;
            proxy_pass $gateway_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https; # public scheme is always https
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
